<!--
  The agentistics mark, as supplied. Two changes and no others, both required by where it is drawn:

  - `currentColor` instead of the fixed #6672A5. VS Code tints an activity-bar icon itself — dim
    when the view is inactive, the theme's foreground when it is — and a hardcoded colour keeps the
    icon at one shade while every neighbour responds, which reads as a broken icon rather than a
    branded one.
  - A SQUARE viewBox. The artwork is 323x441; the activity bar draws into a square, so a tall
    viewBox is letterboxed and the mark comes out smaller than everything beside it. The extra
    width is padding around the original coordinates — nothing is scaled or moved.
-->
<svg width="441" height="441" viewBox="-59 0 441 441" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="89.5" y="390.49" width="29" height="44" stroke="currentColor" stroke-width="12"/>
